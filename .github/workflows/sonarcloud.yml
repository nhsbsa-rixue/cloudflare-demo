name: SonarCloud Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Sync SvelteKit generated config
        run: pnpm --filter @cloudflare-demo/frontend exec svelte-kit sync

      - name: Generate coverage and test reports
        run: pnpm -r --filter @cloudflare-demo/backend --filter @cloudflare-demo/database --filter @cloudflare-demo/frontend test:coverage

      - name: Normalize coverage paths for Sonar
        run: |
          mkdir -p .sonar
          sed 's|^SF:src/|SF:modules/backend/src/|' modules/backend/coverage/lcov.info > .sonar/backend.lcov.info
          sed 's|^SF:src/|SF:modules/database/src/|' modules/database/coverage/lcov.info > .sonar/database.lcov.info
          sed 's|^SF:src/|SF:modules/frontend/src/|' modules/frontend/coverage/lcov.info > .sonar/frontend.lcov.info
          cat .sonar/backend.lcov.info .sonar/database.lcov.info .sonar/frontend.lcov.info > .sonar/lcov.info

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=false
            -Dsonar.sources=modules
            -Dsonar.exclusions=**/node_modules/**,**/coverage/**,**/.svelte-kit/**,**/dist/**,**/.wrangler/**
            -Dsonar.javascript.lcov.reportPaths=.sonar/lcov.info
