sonar.organization=nhsbsa-rixue
sonar.projectKey=cloudflare-demo

sonar.sources=modules
sonar.tests=modules
sonar.test.inclusions=modules/**/*.test.ts,modules/**/test/**/*.ts
sonar.exclusions=docs/**,**/coverage/**,report/**,modules/utils/**
